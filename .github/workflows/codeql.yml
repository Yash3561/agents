name: CodeQL Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Every Wednesday at 2:00 AM UTC
    - cron: "0 2 * * 3"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # This job is informational only — it does NOT block PR merges or pushes.
    # Results are uploaded to the GitHub Security tab when Advanced Security is enabled.
    # continue-on-error: true ensures the workflow does not fail if SARIF upload is
    # blocked by a missing GitHub Advanced Security licence.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended catches more than the default suite
          queries: security-extended

      # CodeQL auto-builds JavaScript/TypeScript — no explicit build step needed
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
