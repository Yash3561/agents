name: Deploy to Staging → Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        id: build
        run: |
          IMAGE_TAG="v$(date +%Y%m%d)-${{ github.run_number }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          docker build --platform linux/amd64 \
            -t caab3198e06dacr.azurecr.io/neonping:${IMAGE_TAG} .
          az acr login --name caab3198e06dacr
          docker push caab3198e06dacr.azurecr.io/neonping:${IMAGE_TAG}

      - name: Deploy to staging
        run: |
          az containerapp update \
            --name neonping-staging \
            --resource-group neonping-rg \
            --image caab3198e06dacr.azurecr.io/neonping:${{ steps.build.outputs.image_tag }}

      - name: Wait for container to start
        run: sleep 30

      - name: Smoke tests on staging
        run: |
          STAGING_URL="https://neonping-staging.politeocean-a6f0ef16.southcentralus.azurecontainerapps.io"
          bash scripts/smoke-tests.sh $STAGING_URL

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps and Playwright browsers
        run: |
          HUSKY=0 npm ci
          npx playwright install --with-deps chromium

      - name: E2E tests on staging
        run: npm run test:e2e
        env:
          STAGING_URL: "https://neonping-staging.politeocean-a6f0ef16.southcentralus.azurecontainerapps.io"
          SHOPIFY_STORE_URL: "https://neonping-dev-a509ojgs.myshopify.com"

  promote-to-production:
    runs-on: ubuntu-latest
    needs: build-and-deploy-staging
    # environment: production creates a manual approval gate.
    # To set up: go to repo Settings → Environments → New environment → name it "production"
    # and add required reviewers. Remove this line for fully automatic promotion.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to production
        run: |
          az containerapp update \
            --name neonping \
            --resource-group neonping-rg \
            --image caab3198e06dacr.azurecr.io/neonping:${{ needs.build-and-deploy-staging.outputs.image_tag }}

      - name: Smoke tests on production
        run: |
          bash scripts/smoke-tests.sh \
            https://neonping.politeocean-a6f0ef16.southcentralus.azurecontainerapps.io

      - name: Shopify deploy
        run: npx shopify app deploy --allow-updates
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOPIFY_APP_URL: "https://neonping.politeocean-a6f0ef16.southcentralus.azurecontainerapps.io"
        continue-on-error: true
