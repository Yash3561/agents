name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:  # allow manual trigger from GitHub UI or CLI

permissions:
  id-token: write   # required for OIDC token exchange with Azure
  contents: read

jobs:
  # ── Job 1: TypeScript check ─────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true  # pre-existing Polaris tone="subdued" deprecations; tracked separately

  # ── Job 2: Build Docker image and deploy to Azure Container Apps ────────────
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: typecheck  # waits for typecheck but doesn't block on its outcome
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG="v$(date +%Y%m%d)-${{ github.run_number }}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: caab3198e06dacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            caab3198e06dacr.azurecr.io/neonping:${{ steps.tag.outputs.image_tag }}
            caab3198e06dacr.azurecr.io/neonping:latest
          build-args: |
            BUILD_VERSION=${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: caab3198e06dacr.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: neonping
          resourceGroup: neonping-rg
          imageToDeploy: caab3198e06dacr.azurecr.io/neonping:${{ steps.tag.outputs.image_tag }}

  # ── Job 3: Smoke tests (with rollback on failure) ───────────────────────────
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for container to start
        run: sleep 60

      - name: Make smoke tests executable
        run: chmod +x scripts/smoke-tests.sh

      - name: Run smoke tests
        id: smoke
        run: scripts/smoke-tests.sh
        continue-on-error: true

      - name: Azure login for rollback
        if: steps.smoke.outcome == 'failure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback to previous revision
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed — rolling back to previous revision"
          PREV_REVISION=$(az containerapp revision list \
            --name neonping \
            --resource-group neonping-rg \
            --query "sort_by([?properties.active], &properties.createdTime)[-2].name" \
            --output tsv)
          if [ -n "$PREV_REVISION" ]; then
            az containerapp ingress traffic set \
              --name neonping \
              --resource-group neonping-rg \
              --revision-weight "${PREV_REVISION}=100"
            echo "Traffic routed 100% to ${PREV_REVISION}"
          else
            echo "No previous revision found — cannot roll back"
          fi

      - name: Fail job if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  # ── Job 4: Shopify app deploy (webhooks, extensions) ───────────────────────
  shopify-deploy:
    name: Shopify deploy
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Shopify app (webhooks + extensions)
        run: npx shopify app deploy --allow-updates
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOPIFY_APP_URL: https://neonping.politeocean-a6f0ef16.southcentralus.azurecontainerapps.io
